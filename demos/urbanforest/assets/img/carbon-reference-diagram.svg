<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">UrbanForest reference-case carbon projection diagram</title>
<desc id="desc">A cumulative 20-year carbon projection for a 30 square metre Trinity-style urban forest, with a low-high uncertainty band and a central estimate.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#f8faf4"/>
    <stop offset="100%" stop-color="#edf3e8"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="30" width="1132" height="700" rx="28" fill="white" fill-opacity="0.72" stroke="#d7e1d4"/>

<text x="110" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17321f">UrbanForest reference-case carbon projection</text>
<text x="110" y="100" font-family="Inter,Arial,sans-serif" font-size="19" fill="#4f6758">Cumulative 20-year scenario for 30 m², ~90 plants, implemented mix, stand age 1 year</text>
<line x1="110" y1="650.0" x2="1140" y2="650.0" stroke="#dfe6dc" stroke-width="1"/>
<text x="96" y="656.0" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">0 kg</text>
<line x1="110" y1="515.0" x2="1140" y2="515.0" stroke="#dfe6dc" stroke-width="1"/>
<text x="96" y="521.0" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">566 kg</text>
<line x1="110" y1="380.0" x2="1140" y2="380.0" stroke="#dfe6dc" stroke-width="1"/>
<text x="96" y="386.0" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">1.1 t</text>
<line x1="110" y1="245.0" x2="1140" y2="245.0" stroke="#dfe6dc" stroke-width="1"/>
<text x="96" y="251.0" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">1.7 t</text>
<line x1="110" y1="110.0" x2="1140" y2="110.0" stroke="#dfe6dc" stroke-width="1"/>
<text x="96" y="116.0" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">2.3 t</text>
<text x="110.0" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Y1</text>
<text x="326.8" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Y5</text>
<text x="597.9" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Y10</text>
<text x="868.9" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Y15</text>
<text x="1140.0" y="686" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Y20</text>
<line x1="110" y1="650.0" x2="1140" y2="650.0" stroke="#c8d5c5" stroke-width="1.5"/>
<polygon points="110.0,646.6 164.2,638.9 218.4,625.8 272.6,607.0 326.8,583.3 381.1,556.7 435.3,528.7 489.5,499.2 543.7,469.0 597.9,438.1 652.1,407.5 706.3,377.4 760.5,347.6 814.7,318.2 868.9,289.2 923.2,260.6 977.4,232.4 1031.6,204.5 1085.8,177.1 1140.0,150.0 1140.0,390.7 1085.8,404.8 1031.6,419.0 977.4,433.4 923.2,448.1 868.9,462.9 814.7,478.0 760.5,493.2 706.3,508.6 652.1,524.3 597.9,540.1 543.7,556.1 489.5,571.8 435.3,587.1 381.1,601.6 326.8,615.4 272.6,627.7 218.4,637.5 164.2,644.2 110.0,648.2" fill="#6b8f5f" fill-opacity="0.18" stroke="#6b8f5f" stroke-opacity="0.25" stroke-width="1.5"/>
<polyline points="110.0,647.5 164.2,641.8 218.4,632.1 272.6,618.1 326.8,600.6 381.1,580.9 435.3,560.1 489.5,538.3 543.7,515.9 597.9,493.0 652.1,470.4 706.3,448.0 760.5,426.0 814.7,404.2 868.9,382.7 923.2,361.5 977.4,340.6 1031.6,320.0 1085.8,299.7 1140.0,279.6" fill="none" stroke="#2f6b3f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="830" y="120" width="270" height="150" rx="18" fill="#f7faf6" stroke="#d7e1d4"/>
<text x="848" y="154" font-family="Inter,Arial,sans-serif" font-size="15" fill="#667b6c">Mode</text>
<text x="970" y="154" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17321f">Whole site</text>
<text x="848" y="182" font-family="Inter,Arial,sans-serif" font-size="15" fill="#667b6c">Projection</text>
<text x="970" y="182" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17321f">20 years</text>
<text x="848" y="210" font-family="Inter,Arial,sans-serif" font-size="15" fill="#667b6c">Year 20 cumulative</text>
<text x="970" y="210" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17321f">1.55 t CO₂e</text>
<text x="848" y="238" font-family="Inter,Arial,sans-serif" font-size="15" fill="#667b6c">Use</text>
<text x="970" y="238" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17321f">Illustrative only</text>
<circle cx="118" cy="702" r="8" fill="#6b8f5f" fill-opacity="0.18" stroke="#6b8f5f" stroke-opacity="0.28"/>
<text x="134" y="707" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Low to high range</text>
<line x1="330" y1="702" x2="360" y2="702" stroke="#2f6b3f" stroke-width="5" stroke-linecap="round"/>
<text x="374" y="707" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Central estimate</text>
<text x="600.0" y="738" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667b6c">Projection year</text>
</svg>