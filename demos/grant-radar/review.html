<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12382e" />
  <title>Grant Radar Review | Discovery candidates</title>
  <style>
    :root { --bg:#07111b; --panel:rgba(10,33,44,.92); --line:rgba(110,214,196,.18); --text:#ecf8f5; --muted:#b8d9d1; --accent:#72ebc2; --shadow:0 24px 58px rgba(0,0,0,.28); --radius:20px; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 12% 12%, rgba(81,216,255,.18), transparent 26%), radial-gradient(circle at 88% 10%, rgba(120,255,202,.18), transparent 24%), linear-gradient(135deg,#06111d 0%,#0a1e2c 35%,#0b2d31 62%,#0f362e 100%); color:var(--text); min-height:100vh; }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    .shell { width:min(1240px, calc(100% - 2rem)); margin:0 auto; padding:1rem 0 3rem; }
    .panel { margin-top:1rem; padding:1.25rem; border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(180deg, rgba(7,29,38,.94), rgba(12,39,42,.94)); box-shadow:var(--shadow); }
    .eyebrow { margin:0 0 .5rem; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:#d7ff8a; }
    h1,h2,h3,p { margin-top:0; } .lede,.muted,.small { color:var(--muted); }
    .summary-grid,.controls-grid,.cards-grid { display:grid; gap:.85rem; }
    .summary-grid { grid-template-columns:repeat(4, minmax(0,1fr)); } .controls-grid { grid-template-columns:repeat(4, minmax(0,1fr)); } .cards-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .summary-box,.candidate-card { border-radius:18px; border:1px solid rgba(255,255,255,.08); background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)); padding:1rem; }
    .summary-label { font-size:.85rem; color:var(--muted); } .summary-value { font-size:1.3rem; font-weight:800; margin-top:.2rem; }
    label { display:block; margin-bottom:.4rem; color:var(--muted); font-size:.9rem; }
    input,select { width:100%; min-height:46px; padding:.8rem .9rem; border-radius:14px; border:1px solid rgba(255,255,255,.12); background:rgba(5,16,25,.72); color:var(--text); }
    .top-row,.tag-row,.actions { display:flex; flex-wrap:wrap; gap:.55rem; align-items:center; }
    .top-row { justify-content:space-between; align-items:flex-start; margin-bottom:.8rem; }
    .tag,.pill { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:.45rem .75rem; font-size:.82rem; border:1px solid rgba(255,255,255,.10); white-space:nowrap; }
    .pill-pending { background:rgba(255,202,87,.16); border-color:rgba(255,202,87,.45); color:#fff2c4; }
    .pill-approved { background:rgba(70,207,126,.16); border-color:rgba(70,207,126,.45); color:#defee7; }
    .pill-rejected { background:rgba(234,121,146,.16); border-color:rgba(234,121,146,.45); color:#ffe7ee; }
    .pill-promoted { background:rgba(149,221,255,.16); border-color:rgba(149,221,255,.45); color:#e6f8ff; }
    .score-high { background:linear-gradient(180deg,#46cf7e,#279c58); border-color:rgba(205,255,224,.7); color:#f6fff8; font-weight:800; }
    .score-mid { background:linear-gradient(180deg,#ffca57,#de8e10); border-color:rgba(255,239,188,.72); color:#fffaf0; font-weight:800; }
    .score-low { background:linear-gradient(180deg,#738394,#566270); border-color:rgba(228,236,245,.42); color:#f5f8fb; font-weight:800; }
    .tag { background:rgba(255,255,255,.04); color:var(--text); }
    .actions a { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 1rem; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--text); font-weight:700; text-decoration:none; }
    .actions a:hover { background:rgba(114,235,194,.12); border-color:var(--accent); }
    .empty-state { padding:1rem; border-radius:16px; background:rgba(255,255,255,.04); border:1px dashed rgba(255,255,255,.16); color:var(--muted); }
    @media (max-width:980px) { .summary-grid,.controls-grid,.cards-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <p class="eyebrow">Grant Radar review layer</p>
      <h1>Discovery candidates</h1>
      <p class="lede">This page reviews candidate grant pages discovered by the new Phase 2 discovery layer. Candidates here are not automatically published to the live catalogue.</p>
      <p><a href="./">← Back to Grant Radar</a></p>
    </section>
    <section class="panel"><h2>Summary</h2><div class="summary-grid" id="summary-grid"></div></section>
    <section class="panel">
      <h2>Filter candidates</h2>
      <div class="controls-grid">
        <div><label for="search">Search</label><input id="search" type="search" placeholder="domain, title, purpose, source hint" /></div>
        <div><label for="status">Review status</label><select id="status"><option value="all">All statuses</option><option value="pending_review">Pending review</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="promoted">Promoted</option></select></div>
        <div><label for="confidence">Minimum confidence</label><select id="confidence"><option value="0">Any score</option><option value="0.45">0.45+</option><option value="0.60">0.60+</option><option value="0.80">0.80+</option></select></div>
        <div><label for="seen">Seen in latest run</label><select id="seen"><option value="all">All</option><option value="yes">Seen now</option><option value="no">Older only</option></select></div>
      </div>
    </section>
    <section class="panel"><h2>Candidate queue</h2><div id="cards" class="cards-grid"></div></section>
  </div>
  <script>
    const state = { payload: null };
    const el = {
      summaryGrid: document.getElementById('summary-grid'), cards: document.getElementById('cards'),
      search: document.getElementById('search'), status: document.getElementById('status'),
      confidence: document.getElementById('confidence'), seen: document.getElementById('seen'),
    };
    function scoreClass(score) { if (score >= 0.8) return 'score-high'; if (score >= 0.6) return 'score-mid'; return 'score-low'; }
    function statusClass(status) { if (status === 'approved') return 'pill-approved'; if (status === 'rejected') return 'pill-rejected'; if (status === 'promoted') return 'pill-promoted'; return 'pill-pending'; }
    function summaryBox(label, value) { return `<div class="summary-box"><div class="summary-label">${label}</div><div class="summary-value">${value}</div></div>`; }
    function renderSummary() {
      const meta = state.payload.meta || {};
      el.summaryGrid.innerHTML = [summaryBox('Generated at', meta.generated_at || '—'), summaryBox('Candidates', meta.candidate_count || 0), summaryBox('High confidence', meta.high_confidence_count || 0), summaryBox('Pending review', meta.pending_review_count || 0)].join('');
    }
    function filteredCandidates() {
      const search = el.search.value.trim().toLowerCase();
      const status = el.status.value; const minConfidence = Number(el.confidence.value); const seen = el.seen.value;
      return (state.payload.candidates || []).filter((item) => {
        const haystack = [item.title, item.domain, item.source_hint, ...(item.suggested_purposes || []), ...(item.suggested_applicant_types || []), ...(item.reason_flags || [])].join(' ').toLowerCase();
        if (search && !haystack.includes(search)) return false;
        if (status !== 'all' && item.status !== status) return false;
        if (Number(item.confidence || 0) < minConfidence) return false;
        if (seen === 'yes' && !item.seen_in_latest_run) return false;
        if (seen === 'no' && item.seen_in_latest_run) return false;
        return true;
      });
    }
    function renderCards() {
      const candidates = filteredCandidates();
      if (candidates.length === 0) { el.cards.innerHTML = '<div class="empty-state">No candidates match the current review filters.</div>'; return; }
      el.cards.innerHTML = candidates.map((item) => `
        <article class="candidate-card">
          <div class="top-row"><div class="tag-row"><span class="pill ${statusClass(item.status)}">${item.status.replaceAll('_', ' ')}</span><span class="pill ${scoreClass(Number(item.confidence || 0))}">confidence ${Number(item.confidence || 0).toFixed(2)}</span></div><div class="small">${item.seen_in_latest_run ? 'Seen in latest run' : 'Older candidate'}</div></div>
          <h3>${item.title || 'Untitled candidate'}</h3>
          <p class="small">${item.domain} · via ${item.discovered_via} · source hint: ${item.source_hint || '—'}</p>
          <p>${item.snippet || 'No snippet available.'}</p>
          <div class="tag-row">${(item.suggested_purposes || []).map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          <div class="tag-row" style="margin-top:.55rem;">${(item.suggested_applicant_types || []).map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          <p class="small" style="margin-top:.8rem;"><strong>Reason flags:</strong> ${(item.reason_flags || []).join(', ') || '—'}</p>
          <p class="small"><strong>Deadline hint:</strong> ${item.deadline_hint || '—'}</p>
          <p class="small"><strong>First seen:</strong> ${item.first_seen || '—'}<br><strong>Last seen:</strong> ${item.last_seen || '—'}</p>
          <div class="actions"><a href="${item.url}" target="_blank" rel="noopener noreferrer">Open candidate page</a></div>
        </article>`).join('');
    }
    async function init() {
      const response = await fetch('./data/discovery-candidates.json', { cache: 'no-store' });
      state.payload = await response.json();
      renderSummary(); renderCards();
      [el.search, el.status, el.confidence, el.seen].forEach((node) => node.addEventListener('input', renderCards));
    }
    init().catch((error) => { console.error(error); el.cards.innerHTML = '<div class="empty-state">Review queue failed to load. Check that <code>data/discovery-candidates.json</code> exists.</div>'; });
  </script>
</body>
</html>
