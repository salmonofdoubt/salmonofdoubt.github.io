name: Refresh Ireland Energy Transition Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ietm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/ietm/ops/requirements.txt

      - name: Run Energy Monitor pipeline
        run: |
          cd demos/ietm
          python ops/run_pipeline.py

      - name: Commit generated monitor data
        run: |
          if git diff --quiet -- demos/ietm/data; then
            echo "No monitor data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add demos/ietm/data
          git commit -m "Refresh Ireland Energy Transition Monitor data"
          git push
