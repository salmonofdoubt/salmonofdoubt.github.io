name: Refresh Ireland Energy Transition Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

# All workflows that commit to master share this group. This prevents separate
# scheduled jobs from racing each other between rebase and push.
concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/ietm/ops/requirements.txt

      - name: Run Energy Monitor pipeline
        run: |
          cd demos/ietm
          python ops/run_pipeline.py

      - name: Commit generated monitor data
        run: |
          if git diff --quiet -- demos/ietm/data demos/ietm/VERSION demos/ietm/index.html; then
            echo "No monitor data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add demos/ietm/data demos/ietm/VERSION demos/ietm/index.html
          git commit -m "Refresh Ireland Energy Transition Monitor data"

          bash scripts/ci/safe-rebase-push.sh master
