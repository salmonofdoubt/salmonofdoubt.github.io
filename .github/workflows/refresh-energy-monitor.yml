name: Refresh Ireland Energy Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: ireland-energy-monitor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/ireland-energy-monitor/ops/requirements.txt

      - name: Harvest EirGrid data
        run: |
          cd demos/ireland-energy-monitor
          python ops/harvest_eirgrid.py

      - name: Harvest EirGrid CO2 intensity
        run: |
          cd demos/ireland-energy-monitor
          python ops/harvest_eirgrid_co2.py

      - name: Harvest SEAI price data
        run: |
          cd demos/ireland-energy-monitor
          python ops/harvest_seai_prices.py

      - name: Build target tracker
        run: |
          cd demos/ireland-energy-monitor
          python ops/build_target_tracker.py

      - name: Build or import county hosting index
        run: |
          cd demos/ireland-energy-monitor
          python ops/harvest_seai_county_dashboard.py

      - name: Build and validate monitor JSON
        run: |
          cd demos/ireland-energy-monitor
          python ops/build_monitor.py
          python ops/validate_monitor.py

      - name: Commit generated monitor data
        run: |
          if git diff --quiet -- demos/ireland-energy-monitor/data; then
            echo "No monitor data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add demos/ireland-energy-monitor/data
          git commit -m "Refresh Ireland Energy Monitor data"
          git push
