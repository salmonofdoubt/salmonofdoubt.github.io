name: Refresh geo radar catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/geo-radar/ops/requirements.txt

      - name: Discover candidate opportunity pages
        run: python demos/geo-radar/ops/discover_grants.py

      - name: Refresh trusted geo radar catalogue
        run: python demos/geo-radar/ops/harvest_grants.py

      - name: Commit updated geo radar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demos/geo-radar/data/catalog.json
          git add demos/geo-radar/data/discovery-candidates.json
          git add demos/geo-radar/data/source-memory.json
          git add demos/geo-radar/data/source-registry.json

          git diff --cached --quiet && exit 0

          git commit -m "Refresh geo radar data"

          for attempt in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "Push failed on attempt $attempt, retrying in 5 seconds..."
            sleep 5
          done