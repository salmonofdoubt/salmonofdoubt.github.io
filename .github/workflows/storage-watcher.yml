name: IETM storage watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  storage-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update storage watcher data
        run: |
          python3 scripts/update-storage-watcher.py
          python3 scripts/rank-storage-watcher.py
          python3 scripts/normalize-monitors.py
          python3 scripts/build-job-status.py
          python3 scripts/validate-monitor-data.py

      - name: Commit storage watcher data if changed
        run: |
          if git diff --quiet -- demos/ietm/data/storage-flexibility.json demos/ietm/data/storage-ranked.json demos/ietm/data/storage-ranked.csv demos/ietm/data/storage-ranked.md data/monitor-items.json data/job-status.json; then
            echo "No storage watcher changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demos/ietm/data/storage-flexibility.json demos/ietm/data/storage-ranked.json demos/ietm/data/storage-ranked.csv demos/ietm/data/storage-ranked.md data/monitor-items.json data/job-status.json
          git commit -m "Update IETM storage watcher"
          bash scripts/ci/safe-rebase-push.sh master
