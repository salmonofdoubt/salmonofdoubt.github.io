name: Build SMK KAS2232 specimen asset (temporary)

on:
  push:
    branches:
      - feature/david-smk-dual-specimen-20261109
    paths:
      - '.github/workflows/david-smk-build-temporary.yml'
      - 'demos/david-light-lab/tools/build_smk_specimen.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'salmonofdoubt/salmonofdoubt.github.io' && github.ref == 'refs/heads/feature/david-smk-dual-specimen-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/david-smk-dual-specimen-20261109
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert pinned SMK STL to indexed mesh
        run: |
          python -m pip install --disable-pip-version-check numpy
          python demos/david-light-lab/tools/build_smk_specimen.py
      - name: Verify and commit second specimen to isolated branch
        run: |
          test -s demos/david-light-lab/assets/david-smk-kas2232.dlb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demos/david-light-lab/assets/david-smk-kas2232.dlb
          if ! git diff --cached --quiet; then
            git commit -m "David: add checksum-verified SMK KAS2232 specimen mesh"
            git push origin HEAD:refs/heads/feature/david-smk-dual-specimen-20261109
          fi
