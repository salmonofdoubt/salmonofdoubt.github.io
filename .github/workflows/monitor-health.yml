name: Monitor health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  monitor-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build monitor hub data
        run: |
          python3 scripts/normalize-monitors.py
          python3 scripts/build-job-status.py
          python3 scripts/validate-monitor-data.py

      - name: Commit monitor data if changed
        run: |
          if git diff --quiet -- data/monitor-items.json data/job-status.json; then
            echo "No monitor data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/monitor-items.json data/job-status.json
          git commit -m "Update monitor health data"
          bash scripts/ci/safe-rebase-push.sh master
