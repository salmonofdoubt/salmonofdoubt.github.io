name: D4B Evidence Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [master]
    paths:
      - 'demos/d4b-quiz/questions.js'
      - 'demos/d4b-quiz/candidates.json'
      - 'demos/d4b-quiz/sources.json'
      - 'demos/d4b-quiz/quiz.js'
      - 'demos/d4b-quiz/refresh.js'
      - 'demos/d4b-quiz/index.html'
      - 'demos/d4b-quiz/service-worker.js'
      - 'scripts/d4b-consolidate.cjs'
      - 'scripts/test-d4b-*.cjs'
      - '.github/workflows/d4b-refresh.yml'
  pull_request:
    paths:
      - 'demos/d4b-quiz/**'
      - 'scripts/d4b-consolidate.cjs'
      - 'scripts/test-d4b-*.cjs'
      - '.github/workflows/d4b-refresh.yml'

permissions:
  contents: write

concurrency:
  group: d4b-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: D4B source check and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test unattended D4B refresh
        run: node scripts/test-d4b-auto-refresh.cjs
      - name: Test D4B question-bank parser
        run: node scripts/test-d4b-bank-parser.cjs
      - name: Test module-booklet evidence review
        run: node scripts/test-d4b-course-alignment.cjs
      - name: Test private Moodle import
        run: node scripts/test-d4b-private-import.cjs
      - name: Check external sources
        run: node scripts/d4b-consolidate.cjs discover
      - name: Incorporate vetted candidate questions
        run: node scripts/d4b-consolidate.cjs ingest
      - name: Audit question bank
        run: node scripts/d4b-consolidate.cjs audit
      - name: Consolidate evidence report
        run: node scripts/d4b-consolidate.cjs consolidate
      - name: Confirm idempotent candidate ingestion on PR
        if: github.event_name == 'pull_request'
        run: |
          node scripts/d4b-consolidate.cjs ingest
          node -e "const assert=require('node:assert/strict');const r=require('./demos/d4b-quiz/ingestion-report.json');assert.equal(r.added,0);assert.equal(r.already_present,36);console.log('Idempotency: 0 re-added, 36 retained.')"
          node scripts/d4b-consolidate.cjs audit
      - name: Publish consolidation report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/d4b-quiz/source-check.json demos/d4b-quiz/audit-report.json demos/d4b-quiz/consolidation.json demos/d4b-quiz/ingestion-report.json demos/d4b-quiz/review-queue.json demos/d4b-quiz/questions.js demos/d4b-quiz/index.html demos/d4b-quiz/service-worker.js
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore(d4b): record audited refresh"
            git push
          fi
