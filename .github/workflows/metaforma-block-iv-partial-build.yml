name: MetaForma Block IV partial colour edition build

on:
  push:
    branches:
      - metaforma-block4-partial-15-16
    paths:
      - ".github/workflows/metaforma-block-iv-partial-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-palettes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved artwork
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check "pillow>=10,<13" "numpy>=1.26,<3"
      - name: Generate Block IV (15–16) palette editions at original dimensions
        run: python demos/metaforma/tools/generate_palettes.py --block IV
      - name: Test original image integrity, palettes and website structure
        run: |
          node demos/metaforma/test-palette-assets.cjs
          node demos/metaforma/test-block4-partial-assets.cjs
          node demos/metaforma/test-site-controls.cjs
          node demos/metaforma/test-evidence.cjs
          node demos/metaforma/test-artwork-gallery.cjs
      - name: Commit 8 new PNGs and 10 WebPs to production branch
        if: github.ref == 'refs/heads/metaforma-block4-partial-15-16'
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/metaforma/art/
          if git diff --cached --quiet; then
            echo "No uncommitted image edition changes"
          else
            git commit -m "MetaForma: store Block IV (15–16) 8 palette PNGs and 10 WebP editions"
            git push origin "HEAD:$GH_BRANCH"
          fi
