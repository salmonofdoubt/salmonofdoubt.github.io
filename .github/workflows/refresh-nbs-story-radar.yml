name: Refresh Water NbS Story Radar

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r demos/wnbs/ops/requirements.txt

      - name: Discover Water NbS stories
        run: python demos/wnbs/ops/discover_stories.py

      - name: Commit refreshed radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/wnbs/data/stories.json demos/wnbs/reports/*.md
          if git diff --cached --quiet; then
            echo "No radar changes to commit"
          else
            git commit -m "Refresh Water NbS story radar"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Create daily report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="demos/wnbs/reports/latest.md"
          TITLE="Water NbS Story Radar $(date -u +'%Y-%m-%d')"
          gh issue create --title "$TITLE" --body-file "$REPORT" || echo "Issue creation skipped or failed"
