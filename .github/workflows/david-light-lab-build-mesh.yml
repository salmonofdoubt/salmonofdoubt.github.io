name: Build David head mesh

on:
  push:
    branches:
      - fix/david-include-full-hand
    paths:
      - 'demos/david-light-lab/tools/build_mesh.py'
      - '.github/workflows/david-light-lab-build-mesh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/david-include-full-hand

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mesh tooling
        run: pip install numpy

      - name: Build cleaned indexed head-hand mesh
        run: python demos/david-light-lab/tools/build_mesh.py

      - name: Commit generated mesh to crop-test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/david-light-lab/assets/david-head.dlb
          git diff --cached --quiet && exit 0
          git commit -m "Generate David mesh with full hand"
          git push origin HEAD:fix/david-include-full-hand
