name: Validate birds PWA

on:
  workflow_dispatch:
  push:
    paths:
      - "demos/birds/**"
      - ".github/workflows/validate-birds-pwa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate birds PWA
        run: |
          python demos/birds/ops/validate_pwa.py
