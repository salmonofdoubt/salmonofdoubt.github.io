name: Art Studio Assets regression

on:
  pull_request:
    paths:
      - "art/assets/art-related.js"
      - "art/assets/art-studio-manager.js"
      - "art/assets/art-studio-manager.css"
      - "art/manage/index.html"
      - "art/data/studio-related.json"
      - "tools/art_curator_server.py"
      - "tools/art_studio_assets.py"
      - "tools/build_art_gallery_static.py"
      - "tests/test_art_studio_assets.py"
      - ".github/workflows/art-studio-assets-ci.yml"
  push:
    paths:
      - "tools/art_studio_assets.py"
      - "tests/test_art_studio_assets.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          python -m py_compile tools/art_studio_assets.py tools/art_curator_server.py tools/build_art_gallery_static.py
          node --check art/assets/art-related.js
          node --check art/assets/art-studio-manager.js
      - name: Existing relationship isolation and archive tests
        run: python -m unittest discover -s tests -p 'test_art_studio_assets.py' -v
      - name: Static build
        run: |
          python tools/build_art_gallery_static.py
          git diff --exit-code -- art/data/related-public.json art/data/studio-related.json
