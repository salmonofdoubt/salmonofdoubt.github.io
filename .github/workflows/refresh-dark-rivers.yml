name: Refresh Dark Rivers data

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "demos/dark-rivers/ops/build_dark_rivers.py"

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit-test EPA normalisation
        run: |
          python3 -m unittest -v demos/dark-rivers/ops/test_build_dark_rivers.py

      - name: Build compact official EPA dataset
        run: |
          python3 demos/dark-rivers/ops/build_dark_rivers.py

      - name: Production contract tests
        run: |
          python3 -m unittest -v demos/dark-rivers/ops/test_production_contract.py

      - name: Render refreshed official data in headless Chrome
        run: |
          bash demos/dark-rivers/ops/smoke_render.sh

      - name: Commit changed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add demos/dark-rivers/data/official.json demos/dark-rivers/data/systems.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Dark Rivers EPA data and connected systems"
          bash scripts/ci/safe-rebase-push.sh master
