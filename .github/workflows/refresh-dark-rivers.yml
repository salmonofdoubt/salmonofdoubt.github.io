name: Refresh Dark Rivers data

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Dark Rivers
        run: |
          python3 -m unittest -v \
            demos/dark-rivers/ops/test_build_dark_rivers.py \
            demos/dark-rivers/ops/test_asset_integrity.py

      - name: Build official EPA dataset
        run: |
          python3 demos/dark-rivers/ops/build_dark_rivers.py
          python3 -m json.tool demos/dark-rivers/data/official.json > /tmp/dark-rivers-official.json
          mv /tmp/dark-rivers-official.json demos/dark-rivers/data/official.json

      - name: Commit changed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add demos/dark-rivers/data/official.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Dark Rivers EPA data"
          bash scripts/ci/safe-rebase-push.sh master
