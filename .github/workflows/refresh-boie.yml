name: Refresh Birds of Ireland Sound Atlas

on:
  workflow_dispatch:
  schedule:
    # Weekly is sufficient: the checklist and audio matches do not need daily pressure.
    - cron: "37 5 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/boie/ops/requirements.txt

      - name: Harvest bird checklist and audio metadata
        run: |
          python demos/boie/ops/harvest_birds.py

      - name: Commit updated atlas data
        run: |
          if git diff --quiet -- demos/boie/data; then
            echo "No atlas data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/boie/data/birds.json demos/boie/data/coverage.json
          git commit -m "Refresh Birds of Ireland Sound Atlas data"
          git pull --rebase --autostash
          git push
