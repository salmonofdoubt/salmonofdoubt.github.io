name: Refresh UrbanForest radar

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-urbanforest-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/urbanforest/news/ops/requirements.txt

      - name: Sync branch before refresh
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

      - name: Refresh UrbanForest radar
        run: |
          python demos/urbanforest/news/ops/discover_urbanforest_news.py
          python demos/urbanforest/news/ops/ensure_urbanforest_watch_lanes.py
          python demos/urbanforest/news/ops/audit_urbanforest_radar.py
          python demos/urbanforest/news/ops/validate_urbanforest_radar.py

      - name: Commit generated data
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-master}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add demos/urbanforest/news/data/news.json \
                  demos/urbanforest/news/data/archive \
                  demos/urbanforest/news/data/source-health.json \
                  demos/urbanforest/news/data/weekly-digest.json \
                  demos/urbanforest/news/data/validation.json

          if git diff --cached --quiet; then
            echo "No UrbanForest radar data changes."
          else
            git commit -m "Refresh UrbanForest radar"

            # If master moved while this job was running, replay this generated-data
            # commit on top of the latest branch before pushing.
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
