name: Refresh UrbanForest News

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r demos/urbanforest/news/ops/requirements.txt

      - name: Discover UrbanForest news
        run: python demos/urbanforest/news/ops/discover_urbanforest_news.py

      - name: Commit refreshed UrbanForest news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/urbanforest/news/data/news.json demos/urbanforest/news/data/archive/
          if git diff --cached --quiet; then
            echo "No UrbanForest news changes to commit."
          else
            git commit -m "Refresh UrbanForest news archive"
            git push
          fi
