name: MetaForma Block I colour edition build

on:
  push:
    branches:
      - metaforma-block1-painterly-palettes
    paths:
      - ".github/workflows/metaforma-palette-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-palettes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork and generator
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install imaging dependencies
        run: python -m pip install --disable-pip-version-check "pillow>=10,<13" "numpy>=1.26,<3"
      - name: Recolour without changing pixel geometry
        run: python demos/metaforma/tools/generate_palettes.py
      - name: Verify 20 image editions and protected originals
        run: |
          node demos/metaforma/test-palette-assets.cjs
          node demos/metaforma/test-site-controls.cjs
          node demos/metaforma/test-evidence.cjs
          node demos/metaforma/test-artwork-gallery.cjs
      - name: Commit palette PNG and WebP assets to preview branch
        if: github.ref == 'refs/heads/metaforma-block1-painterly-palettes'
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/metaforma/art/
          if git diff --cached --quiet; then
            echo "All editions already generated"
          else
            git commit -m "MetaForma: add 16 palette PNGs and 20 web gallery images"
            git push origin "HEAD:$GH_BRANCH"
          fi
