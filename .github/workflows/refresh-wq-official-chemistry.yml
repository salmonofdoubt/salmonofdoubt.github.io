name: Refresh WQ official chemistry

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Discover and download official chemistry files
        run: |
          python demos/wq/ops/download_official_chemistry.py

      - name: Refresh WQ payload
        run: |
          python demos/wq/ops/harvest_wq.py
          python demos/wq/ops/validate_wq.py

      - name: Commit refreshed official chemistry data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/wq/data/source/epa-chemistry demos/wq/data/source/official-downloads demos/wq/data/latest.json demos/wq/data/source-status.json
          if git diff --cached --quiet; then
            echo "No official chemistry data changes."
          else
            git commit -m "Refresh official WQ chemistry data"
            bash scripts/ci/safe-rebase-push.sh master
          fi
