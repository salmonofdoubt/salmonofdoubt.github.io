name: Admin grant radar (review)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "promote or reject"
        required: true
        type: choice
        options:
          - promote
          - reject
      candidate_id:
        description: "Candidate ID or candidate URL from review page"
        required: true
        type: string
      note:
        description: "Optional admin note"
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Grant Radar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/grant-radar/ops/requirements.txt

      - name: Apply admin action
        env:
          GRANT_RADAR_ACTION: ${{ inputs.action }}
          GRANT_RADAR_CANDIDATE_ID: ${{ inputs.candidate_id }}
          GRANT_RADAR_NOTE: ${{ inputs.note }}
        run: python demos/grant-radar/ops/admin_action.py

      - name: Refresh trusted catalogue
        run: python demos/grant-radar/ops/harvest_grants.py

      - name: Commit updated Grant Radar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demos/grant-radar/data/catalog.json
          git add demos/grant-radar/data/discovery-candidates.json
          git add demos/grant-radar/data/discovery-decisions.json
          git add demos/grant-radar/data/source-memory.json
          git add demos/grant-radar/data/source-registry.json
          git add demos/grant-radar/data/harvest-audit.json
          git add demos/grant-radar/data/harvest-memory.json

          git diff --cached --quiet && exit 0

          git commit -m "Grant Radar admin: ${{ inputs.action }} ${{ inputs.candidate_id }}"

          for attempt in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "Push failed on attempt $attempt, retrying in 5 seconds..."
            sleep 5
          done

      - name: Request GitHub Pages rebuild
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
