name: WQ tests

on:
  push:
    paths:
      - "demos/wq/**"
      - ".github/workflows/wq-cq-tests.yml"
  pull_request:
    paths:
      - "demos/wq/**"
      - ".github/workflows/wq-cq-tests.yml"
  workflow_dispatch:

jobs:
  wq-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend C-Q tests
        working-directory: demos/wq
        run: npm run test:cq

      - name: Compile WQ backend
        run: python3 -m compileall -q demos/wq/ops

      - name: Run backend adapter tests
        run: python3 -m unittest discover -s demos/wq/ops/tests -p "*test*.py"

      - name: Validate checked-in WQ data
        run: python3 demos/wq/ops/validate_wq.py
