name: MetaForma complete 34-painting colour edition build
on:
  push:
    branches:
      - metaforma-final-34-palettes-gallery
    paths:
      - ".github/workflows/metaforma-complete-palettes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metaforma-34-paintings-palette-build
  cancel-in-progress: false

jobs:
  editions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out full-resolution original paintings
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install artwork image processing dependencies
        run: python -m pip install --disable-pip-version-check "pillow>=10,<13" "numpy>=1.26,<3"
      - name: Create Block IV remaining five-palette artworks
        run: python demos/metaforma/tools/generate_palettes.py --block IV-remaining
      - name: Create Block V five-palette artworks
        run: python demos/metaforma/tools/generate_palettes.py --block V
      - name: Create Block VI five-palette artworks
        run: python demos/metaforma/tools/generate_palettes.py --block VI
      - name: Verify all original bytes, image ratios, gallery and other assets
        run: |
          node demos/metaforma/test-site-controls.cjs
          node demos/metaforma/test-evidence.cjs
          node demos/metaforma/test-artwork-gallery.cjs
          node demos/metaforma/test-palette-assets.cjs
          node demos/metaforma/test-block2-palette-assets.cjs
          node demos/metaforma/test-block3-palette-assets.cjs
          node demos/metaforma/test-block4-partial-assets.cjs
          node demos/metaforma/test-complete-collection.cjs
      - name: Commit artwork editions to the feature branch
        if: github.ref == 'refs/heads/metaforma-final-34-palettes-gallery'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/metaforma/art/
          if git diff --cached --quiet; then
            echo "All 170 images are already present"
          else
            git commit -m "MetaForma: generate 72 palette PNGs, 90 WebPs for 17–34"
            git push origin HEAD:metaforma-final-34-palettes-gallery
          fi
