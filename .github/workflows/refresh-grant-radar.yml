name: Refresh grant radar catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/grant-radar/ops/requirements.txt

      - name: Discover candidate grant pages
        run: python demos/grant-radar/ops/discover_grants.py

      - name: Refresh trusted catalogue
        run: python demos/grant-radar/ops/harvest_grants.py

      - name: Commit updated radar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/grant-radar/data/catalog.json
          git add demos/grant-radar/data/discovery-candidates.json
          git add demos/grant-radar/data/source-memory.json
          git add demos/grant-radar/data/source-registry.json
          git diff --cached --quiet || git commit -m "Refresh grant radar data"
          git push