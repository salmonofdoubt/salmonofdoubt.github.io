name: Refresh grant radar catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: repo-master-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Grant Radar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/grant-radar/ops/requirements.txt

      - name: Discover candidate grant pages
        run: python demos/grant-radar/ops/discover_grants.py

      - name: Enrich discovery candidates with AI hints
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python demos/grant-radar/ops/ai_enrich_candidates.py

      - name: Refresh trusted catalogue
        run: python demos/grant-radar/ops/harvest_grants.py

      - name: Run Grant Radar health check
        run: python demos/grant-radar/ops/health_check.py

      - name: Commit updated Grant Radar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demos/grant-radar/data/catalog.json
          git add demos/grant-radar/data/discovery-candidates.json
          git add demos/grant-radar/data/ai-candidate-enrichment.json
          git add demos/grant-radar/data/discovery-audit.json
          git add demos/grant-radar/data/discovery-seeds.json
          git add demos/grant-radar/data/source-memory.json
          git add demos/grant-radar/data/harvest-memory.json
          git add demos/grant-radar/data/harvest-audit.json
          git add demos/grant-radar/data/source-registry.json

          git diff --cached --quiet && exit 0

          git commit -m "Refresh grant radar data"

          for attempt in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "Push failed on attempt $attempt, retrying in 5 seconds..."
            sleep 5
          done

      - name: Request GitHub Pages rebuild
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
