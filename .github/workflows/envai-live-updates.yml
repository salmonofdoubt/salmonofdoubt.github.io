name: EnvAI — daily live updates

on:
  schedule:
    - cron: '23 7 * * *'  # daily (UTC); GitHub may delay scheduled workflows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: envai-auto-updates
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'salmonofdoubt/salmonofdoubt.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test discovery and publication rules
        run: python3 -m unittest discover -s tests -p 'test_envai_auto_update.py' -v
      - name: Check watched official releases and discover unverified candidates
        run: python3 scripts/envai_auto_update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data snapshot (only this file)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- demos/envai/data/live-updates.json; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demos/envai/data/live-updates.json
          git commit -m 'EnvAI: refresh watched releases and discovery leads'
          git pull --rebase origin master
          git push origin HEAD:master
      # EnvAI fetches this data from raw.githubusercontent.com. A bot commit
      # cannot trigger a Pages branch build; no Pages settings change needed.
