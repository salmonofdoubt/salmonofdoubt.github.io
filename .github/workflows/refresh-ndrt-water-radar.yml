name: Refresh NDRT water radar

on:
  workflow_dispatch:
  schedule:
    - cron: "21 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-ndrt-water-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demos/ndrt/news/ops/requirements.txt

      - name: Refresh NDRT water radar
        run: python demos/ndrt/news/ops/discover_ndrt_news.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demos/ndrt/news/data/news.json demos/ndrt/news/data/archive
          if git diff --cached --quiet; then
            echo "No NDRT water radar data changes."
          else
            git commit -m "Refresh NDRT water radar"
            git push
          fi
