name: Build David social card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install social-card dependencies
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Start local demo
        run: |
          python demos/david-light-lab/tests/server.py > /tmp/david-social-http.log 2>&1 &
          sleep 2

      - name: Render social card
        run: python demos/david-light-lab/tools/build_social_card.py

      - name: Commit generated social card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/david-light-lab/social-card.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Generate David Light Lab social preview"
          git push origin HEAD
