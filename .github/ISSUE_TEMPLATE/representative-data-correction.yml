name: Representative data correction
description: Suggest a correction to bundled TD or councillor contact data used in the td-lookup demo.
title: "[td-lookup data] "
labels:
  - td-lookup
  - data
body:
  - type: markdown
    attributes:
      value: |
        Use this form for outdated or incorrect contact details, office links, party labels, constituency mappings, or LEA-related representative data.
  - type: dropdown
    id: representative_type
    attributes:
      label: Representative type
      options:
        - TD
        - Councillor
        - Other / unsure
    validations:
      required: true
  - type: input
    id: representative_name
    attributes:
      label: Name
      placeholder: Representative name
    validations:
      required: true
  - type: input
    id: current_value
    attributes:
      label: Current value in the demo
      placeholder: Example: email, web link, party, or area shown now
  - type: input
    id: corrected_value
    attributes:
      label: Proposed correction
      placeholder: Example: new email, web link, party, or area
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source or evidence
      description: Paste an official source URL or describe the source used.
      placeholder: Official council profile, Oireachtas page, or other authoritative source.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Optional context.
