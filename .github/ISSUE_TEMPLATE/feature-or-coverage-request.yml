name: Feature or coverage request
description: Propose an improvement, new capability, or geographic expansion for the td-lookup demo.
title: "[td-lookup feature] "
labels:
  - td-lookup
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature ideas, UX improvements, accessibility suggestions, or proposals to extend coverage beyond the current Dublin-first demonstrator.
  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: One-line description of the request
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe the use case or unmet need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: Describe the feature, workflow, or expansion you want.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Public value or practical benefit
      placeholder: Explain why this would improve the civic usefulness of the tool.
  - type: dropdown
    id: priority
    attributes:
      label: Rough priority
      options:
        - Nice to have
        - Useful
        - Important
        - Critical for a real use case
