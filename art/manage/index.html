<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage DiAndré art</title>
  <style>
    :root {
      --bg: #070605;
      --panel: #100d0a;
      --panel2: #17110c;
      --line: rgba(212, 174, 108, 0.28);
      --text: #f1e1c5;
      --muted: #ad9a7b;
      --gold: #d4ae6c;
      --good: #6ee7a8;
      --bad: #ff7868;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1500px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1rem 0 3rem;
    }

    h1, h2 {
      font-family: Georgia, "Times New Roman", serif;
      color: #fff2d7;
      letter-spacing: -.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: .86;
    }

    h2 {
      margin: 0 0 .7rem;
      font-size: 1.35rem;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(320px, 1.2fr);
      gap: 1rem;
      align-items: end;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }

    .micro {
      margin: 0 0 .4rem;
      color: var(--gold);
      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .hint {
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin: 1rem 0;
    }

    input, select, textarea, button {
      border: 1px solid var(--line);
      background: #0e0b08;
      color: var(--text);
      font: inherit;
      font-size: .86rem;
    }

    input, select, button {
      min-height: 34px;
      border-radius: 999px;
      padding: .32rem .72rem;
    }

    textarea {
      width: 100%;
      min-height: 72px;
      box-sizing: border-box;
      border-radius: 12px;
      padding: .55rem;
      resize: vertical;
    }

    button {
      cursor: pointer;
      font-weight: 800;
    }

    button.primary {
      background: #24190f;
      border-color: rgba(212, 174, 108, .55);
      color: #fff2d7;
    }

    button.danger {
      border-color: rgba(255, 120, 104, .6);
      color: #ffb8ae;
    }

    a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }

    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      gap: 1rem;
      align-items: start;
    }

    .grid {
      display: grid;
      grid-template-display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: .75rem;
      align-items: start;
    }

    .card {
      display: inline-block;
      width: 100%;
      margin: 0 0 .75rem;
      
      border: 1px solid rgba(255,255,255,.07);
      background: var(--panel);
      cursor: pointer;
    }

    .card.hidden {
      opacity: .45;
    }

    .card.dragging {
      opacity: .35;
    }

    .card.drop-target {
      outline: 2px dashed var(--gold);
      outline-offset: 3px;
    }

    .card.selected {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .card div {
      padding: .5rem;
    }

    .card strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff2d7;
      line-height: 1.05;
    }

    .card span {
      display: block;
      margin-top: .28rem;
      color: var(--gold);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .panel {
      position: sticky;
      top: 1rem;
      display: grid;
      gap: 1rem;
    }

    .box {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: .85rem;
    }

    .box.feature {
      background: var(--panel2);
    }

    .form-grid {
      display: grid;
      gap: .55rem;
    }

    .form-grid input,
    .form-grid select {
      width: 100%;
      box-sizing: border-box;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
    }

    .preview {
      display: none;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #050403;
      border: 1px solid rgba(255,255,255,.06);
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      color: var(--muted);
    }

    .checks label {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }

    .checks input {
      min-height: auto;
    }

    @media (max-width: 1050px) {
      .top, .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }

      .grid {
        grid-template-display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      }
    }
  </style>
</head>
<body>
<main>
  <section class="top">
    <div>
      <p class="micro">Local art manager</p>
      <h1>Manage DiAndré art</h1>
    </div>
    <p class="hint">
      One local admin page for feature selection, metadata editing, hiding, and uploading.
      Nothing goes public until you commit and push.
    </p>
  </section>

  <div class="toolbar">
    <select id="collectionFilter"></select>
    <select id="statusFilter">
      <option value="active">Active only</option>
      <option value="all">All including hidden</option>
      <option value="hidden">Hidden only</option>
    </select>
    <input id="search" placeholder="Search title, collection, image">
    <a href="../">Open /art/</a>
    <span id="status" class="status"></span>
  </div>

  <section class="layout">
    <div id="grid" class="grid"></div>

    <aside class="panel">
      <section class="box feature">
        <p class="micro">Feature selected work</p>
        <div class="form-grid">
          <select id="featureTarget">
            <option value="homepageHero">Homepage hero</option>
            <option value="Oil Paintings">Oil Paintings feature</option>
            <option value="Watercolours">Watercolours feature</option>
            <option value="Drawings">Drawings feature</option>
            <option value="Experimental">Experimental feature</option>
            <option value="GeoSpatial Imagery">GeoSpatial Imagery feature</option>
          </select>
          <button class="primary" id="saveFeature">Save feature & rebuild</button>
        </div>
      </section>

      <section class="box">
        <p class="micro">Selected work</p>
        <div id="current" class="hint">No work selected.</div>
      </section>

      <section class="box">
        <h2>Edit selected work</h2>
        <div class="form-grid">
          <input id="title" placeholder="Title">
          <select id="collection"></select>
          <input id="medium" placeholder="Medium">
          <input id="subgroup" placeholder="Subgroup">
          <input id="alt" placeholder="Alt text">
          <textarea id="text" placeholder="Short caption"></textarea>
          <textarea id="reading" placeholder="Longer reading / interpretation"></textarea>
          <select id="workStatus">
            <option value="active">active</option>
            <option value="hidden">hidden</option>
          </select>
          <div class="button-row">
            <button class="primary" id="saveEdit">Save edit & rebuild</button>
            <button id="hideWork">Hide selected</button>
          </div>
        </div>
      </section>

      <section class="box">
        <h2>Upload new work</h2>
        <div class="form-grid">
          <input id="newFile" type="file" accept="image/*">
          <img id="newPreview" class="preview" alt="">
          <input id="newTitle" placeholder="Title">
          <select id="newCollection"></select>
          <input id="newMedium" placeholder="Medium">
          <input id="newSubgroup" placeholder="Subgroup">
          <input id="newAlt" placeholder="Alt text">
          <textarea id="newText" placeholder="Short caption"></textarea>
          <textarea id="newReading" placeholder="Longer reading / interpretation"></textarea>
          <div class="checks">
            <label><input id="makeCollectionFeature" type="checkbox"> collection feature</label>
            <label><input id="makeHomepageHero" type="checkbox"> homepage hero</label>
          </div>
          <button class="primary" id="addWork">Add work & rebuild</button>
        </div>
      </section>
    </aside>
  </section>
</main>

<script>
const collections = ["Oil Paintings", "Watercolours", "Drawings", "Experimental", "GeoSpatial Imagery"];

let draggedArtworkId = null;

const state = {
  artworks: [],
  selectedId: null,
  imageDataUrl: "",
  curation: {
    homepageHero: {},
    collections: {}
  }
};

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function setStatus(message, kind = "") {
  const el = document.getElementById("status");
  el.textContent = message;
  el.className = `status ${kind}`;
}

function imageOf(item) {
  const src = item.thumb || item.image || "";

  if (!src) return "";
  if (src.startsWith("http://") || src.startsWith("https://") || src.startsWith("/") || src.startsWith("../")) {
    return src;
  }

  return "../" + src;
}

function selectedItem() {
  return state.artworks.find((item) => item.id === state.selectedId);
}

function numericOrder(item) {
  const value = Number(item.sortOrder ?? item.order ?? 999999);
  return Number.isFinite(value) ? value : 999999;
}

function compareArtworks(a, b) {
  const collectionOrderA = Number(a.collectionOrder ?? 999);
  const collectionOrderB = Number(b.collectionOrder ?? 999);

  if (collectionOrderA !== collectionOrderB) return collectionOrderA - collectionOrderB;

  const collectionCompare = String(a.collection || "").localeCompare(String(b.collection || ""));
  if (collectionCompare !== 0) return collectionCompare;

  const orderCompare = numericOrder(a) - numericOrder(b);
  if (orderCompare !== 0) return orderCompare;

  return String(a.title || "").localeCompare(String(b.title || ""));
}

function populateSelect(id, values) {
  document.getElementById(id).innerHTML = values
    .map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
    .join("");
}

function selectorFor(item) {
  return {
    id: item.id,
    title: item.title,
    titleContains: item.title,
    collection: item.collection,
    medium: item.medium,
    subgroup: item.subgroup,
    image: item.image,
    thumb: item.thumb || item.image,
    sourceUrl: item.sourceUrl || item.image,
    alt: item.alt || item.title,
    text: item.text || "",
    reading: item.reading || ""
  };
}

async function loadArtworks() {
  const response = await fetch("../data/artworks.json?ts=" + Date.now());
  if (!response.ok) throw new Error("Could not load artworks.json");
  const data = await response.json();
  state.artworks = data.artworks || [];
}

async function loadCuration() {
  try {
    const response = await fetch("../data/art-curation.json?ts=" + Date.now());
    if (!response.ok) return;
    state.curation = await response.json();
    state.curation.homepageHero ||= {};
    state.curation.collections ||= {};
  } catch {}
}

function fillForm(item) {
  document.getElementById("current").innerHTML = item
    ? `<strong style="color:#fff2d7;font-family:Georgia,serif;font-size:1.2rem;">${escapeHtml(item.title)}</strong>
       <p>${escapeHtml(item.collection || "")} · ${escapeHtml(item.subgroup || "")}</p>
       <p>Status: <code>${escapeHtml(item.status || "active")}</code></p>`
    : "No work selected.";

  if (!item) return;

  document.getElementById("title").value = item.title || "";
  document.getElementById("collection").value = item.collection || "Experimental";
  document.getElementById("medium").value = item.medium || "";
  document.getElementById("subgroup").value = item.subgroup || "";
  document.getElementById("alt").value = item.alt || "";
  document.getElementById("text").value = item.text || "";
  document.getElementById("reading").value = item.reading || "";
  document.getElementById("workStatus").value = item.status || "active";
}

function setSelected(id) {
  state.selectedId = id;
  fillForm(selectedItem());
  setStatus("Selected. Feature, edit, hide, or upload.", "");
  render();
}

function render() {
  const grid = document.getElementById("grid");
  const collectionFilter = document.getElementById("collectionFilter").value;
  const statusFilter = document.getElementById("statusFilter").value;
  const query = document.getElementById("search").value.trim().toLowerCase();

  const visible = state.artworks.filter((item) => {
    const status = item.status || "active";
    const collectionOk = collectionFilter === "All" || item.collection === collectionFilter;
    const statusOk =
      statusFilter === "all" ||
      (statusFilter === "active" && status !== "hidden") ||
      (statusFilter === "hidden" && status === "hidden");
    const blob = [item.title, item.collection, item.subgroup, item.medium, item.image, status].join(" ").toLowerCase();
    return collectionOk && statusOk && (!query || blob.includes(query));
  }).sort(compareArtworks);

  grid.innerHTML = visible.map((item) => {
    const hidden = (item.status || "active") === "hidden";
    return `
      <article class="card ${item.id === state.selectedId ? "selected" : ""} ${hidden ? "hidden" : ""}" data-id="${escapeHtml(item.id)}" draggable="true">
        <img src="${escapeHtml(imageOf(item))}" alt="${escapeHtml(item.alt || item.title)}" loading="lazy">
        <div>
          <strong>${escapeHtml(item.title)}</strong>
          <span>${escapeHtml(item.collection)} · ${escapeHtml(item.subgroup || "")}${hidden ? " · hidden" : ""}</span>
        </div>
      </article>
    `;
  }).join("");

  grid.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => setSelected(card.dataset.id));

    card.addEventListener("dragstart", (event) => {
      draggedArtworkId = card.dataset.id;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", card.dataset.id);
    });

    card.addEventListener("dragend", () => {
      draggedArtworkId = null;
      card.classList.remove("dragging");
      grid.querySelectorAll(".drop-target").forEach((item) => item.classList.remove("drop-target"));
    });

    card.addEventListener("dragover", (event) => {
      if (!draggedArtworkId || draggedArtworkId === card.dataset.id) return;
      event.preventDefault();
      card.classList.add("drop-target");
    });

    card.addEventListener("dragleave", () => {
      card.classList.remove("drop-target");
    });

    card.addEventListener("drop", (event) => {
      event.preventDefault();
      card.classList.remove("drop-target");
      saveDraggedOrder(card.dataset.id).catch((error) => setStatus(error.message, "bad"));
    });
  });
}

async function postJson(url, payload) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  const result = await response.json();
  if (!response.ok || !result.ok) throw new Error(result.error || result.message || "Request failed");
  return result;
}

async function saveDraggedOrder(targetId) {
  if (!draggedArtworkId || draggedArtworkId === targetId) return;

  const dragged = state.artworks.find((item) => item.id === draggedArtworkId);
  const target = state.artworks.find((item) => item.id === targetId);

  if (!dragged || !target) return;

  if (dragged.collection !== target.collection) {
    setStatus("Drag within the same collection only.", "bad");
    return;
  }

  const ordered = state.artworks
    .filter((item) => item.collection === dragged.collection && (item.status || "active") !== "hidden")
    .sort(compareArtworks);

  const fromIndex = ordered.findIndex((item) => item.id === dragged.id);
  const toIndex = ordered.findIndex((item) => item.id === target.id);

  if (fromIndex < 0 || toIndex < 0) return;

  const moved = ordered.splice(fromIndex, 1)[0];
  ordered.splice(toIndex, 0, moved);

  setStatus("Saving new order and rebuilding...", "");

  const result = await postJson("/api/reorder-collection", {
    collection: dragged.collection,
    orderedIds: ordered.map((item) => item.id)
  });

  await loadArtworks();
  state.selectedId = dragged.id;
  fillForm(selectedItem());
  render();
  setStatus("Order saved and gallery rebuilt. Refresh /art/.", "good");
}

async function saveFeature() {
  const item = selectedItem();
  if (!item) {
    setStatus("No work selected.", "bad");
    return;
  }

  const target = document.getElementById("featureTarget").value;
  const selector = selectorFor(item);

  if (target === "homepageHero") {
    state.curation.homepageHero = selector;
  } else {
    state.curation.collections ||= {};
    state.curation.collections[target] ||= {};
    state.curation.collections[target].feature = selector;
  }

  setStatus("Saving feature and rebuilding...", "");
  await postJson("/api/save-art-curation", state.curation);
  await loadCuration();
  setStatus("Feature saved and rebuilt. Refresh /art/.", "good");
}

async function saveEdit() {
  const item = selectedItem();
  if (!item) {
    setStatus("No work selected.", "bad");
    return;
  }

  setStatus("Saving edit and rebuilding...", "");

  await postJson("/api/update-artwork", {
    id: item.id,
    title: document.getElementById("title").value,
    collection: document.getElementById("collection").value,
    medium: document.getElementById("medium").value,
    subgroup: document.getElementById("subgroup").value,
    alt: document.getElementById("alt").value,
    text: document.getElementById("text").value,
    reading: document.getElementById("reading").value,
    status: document.getElementById("workStatus").value
  });

  await loadArtworks();
  fillForm(selectedItem());
  render();
  setStatus("Edit saved and rebuilt. Refresh /art/.", "good");
}

async function hideWork() {
  const item = selectedItem();
  if (!item) {
    setStatus("No work selected.", "bad");
    return;
  }

  if (!confirm(`Hide "${item.title}" from the public gallery?`)) return;

  setStatus("Hiding and rebuilding...", "");
  await postJson("/api/hide-artwork", {id: item.id});
  await loadArtworks();
  await loadCuration();
  fillForm(selectedItem());
  render();
  setStatus("Hidden and rebuilt. Refresh /art/.", "good");
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addWork() {
  const title = document.getElementById("newTitle").value.trim();

  if (!state.imageDataUrl) {
    setStatus("Choose an image first.", "bad");
    return;
  }

  if (!title) {
    setStatus("Add a title first.", "bad");
    return;
  }

  setStatus("Adding work and rebuilding...", "");

  const result = await postJson("/api/add-artwork", {
    imageDataUrl: state.imageDataUrl,
    title,
    collection: document.getElementById("newCollection").value,
    medium: document.getElementById("newMedium").value,
    subgroup: document.getElementById("newSubgroup").value || "Other",
    alt: document.getElementById("newAlt").value,
    text: document.getElementById("newText").value,
    reading: document.getElementById("newReading").value,
    makeCollectionFeature: document.getElementById("makeCollectionFeature").checked,
    makeHomepageHero: document.getElementById("makeHomepageHero").checked
  });

  state.imageDataUrl = "";
  document.getElementById("newFile").value = "";
  document.getElementById("newPreview").style.display = "none";

  ["newTitle", "newMedium", "newSubgroup", "newAlt", "newText", "newReading"].forEach((id) => {
    document.getElementById(id).value = "";
  });

  await loadArtworks();
  await loadCuration();
  state.selectedId = result.record.id;
  fillForm(result.record);
  render();
  setStatus("Artwork added and rebuilt. Refresh /art/.", "good");
}

async function init() {
  populateSelect("collectionFilter", ["All", ...collections]);
  populateSelect("collection", collections);
  populateSelect("newCollection", collections);

  document.getElementById("newCollection").value = "Oil Paintings";

  await loadArtworks();
  await loadCuration();

  document.getElementById("collectionFilter").addEventListener("change", render);
  document.getElementById("statusFilter").addEventListener("change", render);
  document.getElementById("search").addEventListener("input", render);
  document.getElementById("saveFeature").addEventListener("click", () => saveFeature().catch((error) => setStatus(error.message, "bad")));
  document.getElementById("saveEdit").addEventListener("click", () => saveEdit().catch((error) => setStatus(error.message, "bad")));
  document.getElementById("hideWork").addEventListener("click", () => hideWork().catch((error) => setStatus(error.message, "bad")));
document.getElementById("addWork").addEventListener("click", () => addWork().catch((error) => setStatus(error.message, "bad")));

  document.getElementById("newFile").addEventListener("change", async (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    state.imageDataUrl = await readFileAsDataUrl(file);

    const preview = document.getElementById("newPreview");
    preview.src = state.imageDataUrl;
    preview.style.display = "block";

    if (!document.getElementById("newTitle").value) {
      document.getElementById("newTitle").value = file.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");
    }
  });

  render();
}

init().catch((error) => {
  document.body.innerHTML = `<main><h1>Manager failed</h1><p>${escapeHtml(error.message)}</p></main>`;
});
</script>
</body>
</html>
